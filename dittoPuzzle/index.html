update: function() {
	if (fase==2) {
		if (!hauntCD) {
			game.physics.arcade.moveToObject(haunter, player, 70, this);
			game.time.events.add(Phaser.Timer.SECOND * 1, function() {
				hauntCD = true;
			});
		}else{
			haunter.body.velocity.x = 0;
			haunter.body.velocity.y = 0;
			game.time.events.add(Phaser.Timer.SECOND * 1, function() {
				hauntCD = false;
			});
		}
	}
	game.physics.arcade.overlap(player, haunter, killPlayer, null, this);

	var hitPlatform = game.physics.arcade.collide(player, platforms);

	if (player._poke != 3) var hitGround = game.physics.arcade.collide(player, digs);
	else var underground = game.physics.arcade.overlap(player, digs);

	if (player._poke == 4) game.physics.arcade.overlap(boulders, player, pushBoulder, null, this);
	var hitBoulder = game.physics.arcade.collide(player, boulders);

	if (underground) player._underground = true;
	else player._underground = false;
	
	game.physics.arcade.collide(berrys, platforms);
	game.physics.arcade.collide(berrys, digs);
	game.physics.arcade.overlap(player, berrys, collectberry, null, this);
	game.physics.arcade.overlap(player, fires, killPlayer, null, this);
	game.physics.arcade.overlap(waters, fires, killFire, null, this);

	player.body.velocity.x = 0;
	var p = POKEMON[player._poke];

	switch (player._poke) {
		case 1: // PIDGEY
			player.body.velocity.y = 0;
			player.animations.play(player._facing);
			if (cursors.down.isDown) { //DOWN
				player.body.velocity.y = 160;
			}
			if (cursors.up.isDown) //UP
			{
				player.body.velocity.y = -100;
			}
			if (cursors.left.isDown) //LEFT
			{
				player.body.velocity.x = -150;
				player._facing = 'left';
				player.animations.play(player._facing);
			}
			if (cursors.right.isDown) //RIGHT
			{
				player.body.velocity.x = 150;
				player._facing = 'right';
				player.animations.play(player._facing);
			}
			break;
		case 2: // SQUIRTLE
											//DOWN
			if (cursors.down.isDown && player.body.touching.down)
			{
				if (!player._shell) {
					player.animations.play('shellIn-'+player._facing);
					player._shell = true;
				}else{
					//player.animations.stop();
				}
			}
			else
			{
				if (cursors.left.isDown) //LEFT
				{
					player.body.velocity.x = -150;
					player._facing = 'left';
					if (player.body.touching.down && hitPlatform)
						player.animations.play(player._facing);
					else
						if (player._facing=='left')
							player.frame = 0;
						else
							player.frame = 19;
				}
				else if (cursors.right.isDown) //RIGHT
				{
					player.body.velocity.x = 150;
					player._facing = 'right';
					if (player.body.touching.down && hitPlatform)
						player.animations.play(player._facing);
					else 
						if (player._facing=='left')
							player.frame = 0;
						else
							player.frame = 19;
				}
				else // NONE
				{
					if (player._shell) {
						player.animations.play('shellOut-'+player._facing);
						player._shell = false;
						delay = true;
					}else{
						if (delay)
							game.time.events.add(Phaser.Timer.SECOND * 1, function() {
								if (player._facing == 'left') player.frame = 6;
								else player.frame = 13;
								delay = false;
							});
						else {
							if (player._facing == 'left') player.frame = 6;
							else player.frame = 13;
						}
					}
				}
				if (cursors.up.isDown && player.body.touching.down && hitPlatform && !player.body.touching.up)
				{
					player.body.velocity.y = -160;
					if (player._facing=='left')
						player.frame = 0;
					else
						player.frame = 19;
					player.animations.stop();
				}
			}
			break;
		case 3: // DIGLETT
									//DOWN
			if (!player.body.touching.down && !hitPlatform && !underground) {
				player.body.velocity.y = 200;
			}else{
				player.body.velocity.y = 0;
			}
			if (cursors.down.isDown && !hitPlatform) {
				player.body.velocity.y = 100;
			}
									//UP
			if (cursors.up.isDown && underground && !hitPlatform)
			{
				player.body.velocity.y = -100;
			}
			if (cursors.left.isDown && !hitPlatform) //LEFT
			{
				player.body.velocity.x = -150;
				player._facing = 'left';
				player.animations.play(player._facing);
			}else
			if (cursors.right.isDown && !hitPlatform) //RIGHT
			{
				player.body.velocity.x = 150;
				player._facing = 'right';
				player.animations.play(player._facing);
			}
			else //NONE
			{
				player.animations.stop();
			}
			break;
		case 4: // MACHOP
									//UP
			if (cursors.up.isDown && player.body.touching.down && !player.body.touching.up)
			{
				player.body.velocity.y = -220;
			}
											//DOWN
			if (cursors.down.isDown && player.body.touching.down)
			{

			}
			else
			{
				if (cursors.left.isDown) //LEFT
				{
					player.body.velocity.x = -200;
					player._facing = 'left';
					player.animations.play(player._facing);
					
				}
				else if (cursors.right.isDown) //RIGHT
				{
					player.body.velocity.x = 200;
					player._facing = 'right';
					player.animations.play(player._facing);
				}
				else // NONE
				{
					if (player._facing=='left')
						player.frame = 7;
					else
						player.frame = 8;
					player.animations.stop();
				}
			}
			break;
		default: // DITTO
			//DOWN
			if (cursors.down.isDown && player.body.touching.down && !player._inDuck) {
				duck();
			}else if (player._inDuck && !cursors.down.isDown && !player.body.touching.up && !hitPlatform) {
				unduck();
			}
									//UP
			if (cursors.up.isDown && player.body.touching.down && !player.body.touching.up)
			{
				player.body.velocity.y = -200;
			}
			if (cursors.left.isDown) //LEFT
			{
				player.body.velocity.x = -150;
				player._facing = 'left';
				player.animations.play(player._facing);
			}else
			if (cursors.right.isDown) //RIGHT
			{
				player.body.velocity.x = 150;
				player._facing = 'right';
				player.animations.play(player._facing);
			}
			else //NONE
			{
				if (player._inDuck && !player.body.touching.up && !hitPlatform) {
					unduck();
				}
				player.animations.stop();
				player.frame = 2;
			}
			break; //default
	}

	if (score >= 60) {
		win();
	}
} // update
} //DittoPuzzle.GameState

function transform(poke=0) {
	if (player._underground || player._inDuck || player._poke == poke || cooldown && poke>0) return false;

	var p = POKEMON[poke];
	var widthDiff = p.width - player.body.width;
	if (widthDiff < 0) widthDiff = 0;
	if (player._facing=='left') widthDiff *= -1;
	var heightDiff = p.height - player.body.height;
	old = player;
	player = game.add.sprite(player.x-widthDiff, player.y-heightDiff, p.texture);
	player._facing = old._facing;
	game.physics.arcade.enable(player);
	old.destroy();
	player._poke = poke;
	player.body.bounce.x = p.bounceX;
	player.body.bounce.y = p.bounceY;
	player.body.gravity.X = p.gravityX;
	player.body.gravity.y = p.gravityY;
	player.body.collideWorldBounds = p.collide;
	switch(poke) {
		case 1: // PIDGEY
			player.animations.add('left', [0, 1, 2, 3], 10, true);
			player.animations.add('right', [7, 6, 5, 4], 10, true);
			player.animations.play(player._facing);
			break;
		case 2: // SQUIRTLE
			player.animations.add('left', [0, 1, 2, 3, 4, 5], 10, true);
			player.animations.add('right', [19, 18, 17, 16, 15], 10, true);
			player.animations.add('right', [19, 18, 17, 16, 15], 10, true);
			player.animations.add('shellIn-left', [8, 9], 5);
			player.animations.add('shellOut-left', [9, 8], 5);
			player.animations.add('shellIn-right', [11, 10], 5);
			player.animations.add('shellOut-right', [10, 11], 5);
			player.animations.add('watergun-left', [7,0], 5);
			player.animations.add('watergun-right', [12,19], 5);
			player.animations.play(player._facing);
			spacebar = game.input.keyboard.addKey(Phaser.Keyboard.SPACEBAR);
			spacebar.onDown.removeAll();
			spacebar.onDown.add(function() {
				player.animations.play('watergun-'+player._facing);
				delay = true;
				if (player._facing=='left') {
					var watergun = waters.create(player.x-70, player.y-6, 'watergun-l');
					game.time.events.add(Phaser.Timer.SECOND * 0.2, function() {watergun.destroy();} );
				}else{
					var watergun = waters.create(player.x+36, player.y-6, 'watergun-r');
					game.time.events.add(Phaser.Timer.SECOND * 0.2, function() {watergun.destroy();} );
				}
			});
			break;
		case 3: // DIGLETT
			spacebar = game.input.keyboard.addKey(Phaser.Keyboard.SPACEBAR);
			spacebar.onDown.removeAll();
			break;
		case 4: // MACHOP 
			player.animations.add('left', [0, 1, 2, 3, 4, 5, 6, 7], 10, true);
			player.animations.add('right', [14, 13, 12, 11, 10, 9, 8], 10, true);
			player.animations.play(player._facing);
			spacebar = game.input.keyboard.addKey(Phaser.Keyboard.SPACEBAR);
			spacebar.onDown.removeAll();
			break;
		default: // DITTO
			player.animations.add('left', [0, 1], 10, true);
			player.animations.add('right', [4, 3], 10, true);
			player.frame = 2;
			spacebar = game.input.keyboard.addKey(Phaser.Keyboard.SPACEBAR);
			spacebar.onDown.removeAll();
			break;
	}
	if (poke>0) {
		//na fase 2 está dando o erro:
		//Cannot read property 'tick' of undefined
		if (p.duration && fase!=2) {
			game.time.events.add(Phaser.Timer.SECOND * p.duration, transform, 0);
		}
		cooldown = true;
	}else{
		game.time.events.events = [];
		game.time.events.add(Phaser.Timer.SECOND * 1, function() {cooldown = false;} );
	}
}

function collectberry (player, berry) {
	berry.kill();
	score += 10;
}

function duck() {
	player.loadTexture('dittoD');
	player._inDuck = true;
	player.body.width = 31;
	player.body.height = player.body.height - 6;
	player.y = player.y + 6;
}

function unduck() {
	player.loadTexture('ditto');
	player._inDuck = false;
	player.body.width = 22;
	player.body.height = player.body.height + 6;
	player.y = player.y - 6;
}

function win() {
	player.kill();
	score = 0;
	player._poke = 0;
	cooldown = false;
	console.log("WIN");
	game.state.start('WinScreen');
}

function killPlayer(player) {
	player.kill();
	score = 0;
	player._poke = 0;
	cooldown = false;
	console.log("WASTED");
	game.state.start('GameOver');
}
function killFire(player, fire) {
	fire.kill();
}
function pushBoulder(player, boulder) {
	if (!game.physics.arcade.collide(boulder, platforms) && !game.physics.arcade.collide(boulder, platforms)) {
		if (player._facing=='left')
			boulder.body.velocity.x = -160;
		else
			boulder.body.velocity.x = 160;

		game.time.events.add(Phaser.Timer.SECOND * 0.2, function() {
			boulder.body.velocity.x = 0;
		});
	}
}

var game = new Phaser.Game(1024, 600, Phaser.CANVAS);
game.state.add('StartScreen',StartScreen.GameState);
game.state.add('DittoPuzzle',DittoPuzzle.GameState);
game.state.add('GameOver',GameOver.GameState);
game.state.add('WinScreen',WinScreen.GameState);
game.state.start('StartScreen');
</script>
